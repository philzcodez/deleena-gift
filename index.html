<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>For Deleena 💜🩵</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="background"></div>
        <canvas id="stars-canvas"></canvas>

        <div class="container">

            <div class="intro-screen" id="intro">
                <h1 class="title">I made something for you.</h1>
                <p class="subtitle">Wanna see 🩵💜?</p>
                <div class="password-row">
                    <input type="password" id="passwordInput" placeholder="e.g. MM/DD/YY"/>
                    <button class="icon-btn" id="togglePassword">👁️</button>
                </div>
                <button id="openBtn">Show Me Please</button>
                <p id="hintText"></p>
            </div>

            <div class="main-content hidden" id="mainContent">
                <div class="glass-card">
                    <h2 id="typing"></h2>

                    <div class="btn-row">
                        <button class="love-btn" id="reasonBtn">Tell Me Something Sweet</button>
                        <button class="love-btn" id="photoBtn">Show Me Someone Beautiful</button>
                        <button class="love-btn" id="gameBtn">Catch My Heart 💜</button>
                    </div>

                    <p id="reasonText"></p>

                    <div id="photoGallery" class="hidden">
                        <div class="polaroid">
                            <img id="galleryImage" src="photos/photo1.jpg" alt="A beautiful photo">
                        </div>
                        <div class="gallery-buttons"></div>
                    </div>

                    <div class="music-player">
                        <div class="player-top">
                            <div class="song-info">
                                <h3 id="songTitle">I Think We're Alone Now</h3>
                                <p id="songArtist">Tiffany</p>
                            </div>
                            <div class="player-controls">
                                <button class="icon-btn" id="prevSongBtn">⏮</button>
                                <button id="playBtn">▶</button>
                                <button class="icon-btn" id="nextSongBtn">⏭</button>
                                <button class="icon-btn" id="queueBtn">☰</button>
                            </div>
                        </div>
                        <div class="progress-wrap">
                            <span class="progress-time" id="currentTime">0:00</span>
                            <div class="progress-bar-bg" id="progressBar">
                                <div class="progress-bar-fill" id="progressFill"></div>
                            </div>
                            <span class="progress-time" id="totalTime">0:00</span>
                        </div>
                        <div id="songList" class="hidden"></div>
                    </div>

                    <audio id="song"></audio>

                    <button id="finalBtn">One Last Thing...</button>

                    <div id="finalScreen" class="hidden">
                        <h1 class="finalText">In every universe...</h1>
                        <h1 class="finalText delay">I'd still choose you.</h1>
                        <p class="endingMessage">Happy Birthday Deleena 🩵💜</p>
                        <button id="backBtn">← Go Back</button>
                    </div>

                </div> <!-- closes .glass-card -->
            </div> <!-- closes .main-content -->

        </div> <!-- closes .container -->

        <!-- Game screen outside the card, fullscreen overlay -->
        <div id="gameScreen" class="hidden">
            <div class="game-hud">
                <div class="game-stat">
                    <span class="game-label">score</span>
                    <span id="gameScore">0</span>
                </div>
                <div class="game-stat">
                    <span class="game-label">time</span>
                    <span id="gameTimer">30</span>
                </div>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div id="gameResult" class="hidden">
                <p id="gameResultMsg"></p>
                <button id="gameRestartBtn">Play Again 💜</button>
                <button id="gameCloseBtn">← Back</button>
            </div>
            <button id="gameExitBtn">✕</button>
        </div>

        <script>
            window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        </script>
        <script defer src="/<unique-path>/script.js"></script>
        <script src="script.js"></script>
    </body>
</html>
